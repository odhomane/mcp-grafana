name: Build and publish to GHCR

# Publishes the custom (silences/notification-policy/contact-point) build to
# ghcr.io/<owner>/mcp-grafana. Runs on every push to the custom branch,
# including the automated upstream-sync commits from sync-upstream.yml - so a
# clean upstream merge results in a freshly published image with no manual step.

on:
  push:
    branches:
      - codex/silences-notification-policies
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcp-grafana:custom-silences
            ghcr.io/${{ github.repository_owner }}/mcp-grafana:custom-silences-${{ github.sha }}
